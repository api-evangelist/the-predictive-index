aid: the-predictive-index
name: The Predictive Index
description: >-
  The Predictive Index (PI) is a talent optimization platform that pairs 70+ years
  of behavioral science with software to help organizations hire, engage, and
  develop teams — behavioral and cognitive assessments, hiring and candidate
  screening, leadership development, employee engagement, and performance
  management. PI publishes a RESTful Integration API (on Azure API Management)
  that lets external systems such as ATS/HRIS platforms programmatically create
  candidates, send behavioral and cognitive assessments, retrieve jobs and
  results, and generate insight and coaching-guide reports — the same data that
  appears in the PI Portal software. Status-change notification webhooks push
  assessment completion events to listening systems. Backed by a $50M investment
  from General Catalyst.
